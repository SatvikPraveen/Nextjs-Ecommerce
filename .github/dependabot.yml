version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Major versions are migrated deliberately, not as a monthly bump.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly
    # Stay on the current Node LTS line; move majors by hand.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: monthly
    # A new Postgres/Redis major needs a data migration for existing volumes.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns: ["*"]
