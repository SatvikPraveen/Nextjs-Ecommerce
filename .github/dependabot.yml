version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly
    groups:
      docker-images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: monthly
    groups:
      compose-images:
        patterns: ["*"]
